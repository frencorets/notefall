<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0b26" />
  <meta name="description" content="Notefall — a free play-along rhythm game that listens to any melodic instrument through your microphone." />
  <title>Notefall</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <main id="app">

    <!-- HOME -->
    <section id="home" class="screen active">
      <div class="hero">
        <img src="icon.svg" alt="" class="logo" width="96" height="96" />
        <h1>Notefall</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <nav class="menu">
        <button class="btn primary big" id="startHereBtn" data-i18n="startHere"></button>
        <button class="btn" id="learnBtn" data-go="lessons" data-i18n="learn"></button>
        <button class="btn" id="playSongsBtn" data-go="library" data-i18n="playSongs"></button>
        <button class="btn" data-go="editor" data-new-song data-i18n="create"></button>
        <div class="menu-row">
          <button class="btn ghost" data-go="settings" data-i18n="settings"></button>
          <button class="btn ghost" data-go="about" data-i18n="about"></button>
        </div>
      </nav>
      <footer class="home-foot">
        <a class="coffee donate" href="#" target="_blank" rel="noopener" data-i18n="coffee"></a>
      </footer>
    </section>

    <!-- SETUP WIZARD -->
    <section id="setup" class="screen">
      <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2 data-i18n="setup"></h2><span></span></header>
      <div class="card wizard">
        <p class="step-count" id="stepCount"></p>
        <div class="wstep" data-step="1">
          <div class="wpic">📱 ➜ 📺</div>
          <h3 data-i18n="s1Title"></h3>
          <p data-i18n="s1Text"></p>
          <p class="small muted" data-i18n="micPrivacy"></p>
          <button class="btn primary big" id="wMicBtn" data-i18n="s1Btn"></button>
        </div>
        <div class="wstep" data-step="2">
          <h3 data-i18n="s2Title"></h3>
          <p data-i18n="s2Text"></p>
          <div class="check-row" id="checkRow"></div>
          <p class="small muted" data-i18n="s2Hint"></p>
          <div class="actions">
            <button class="btn ghost" id="w2Skip" data-i18n="skip"></button>
            <button class="btn primary" id="w2Next" data-i18n="continue"></button>
          </div>
        </div>
        <div class="wstep" data-step="3">
          <h3 data-i18n="s3Title"></h3>
          <p data-i18n="s3Text"></p>
          <div class="actions">
            <button class="btn ghost" id="w3Skip" data-i18n="skip"></button>
            <button class="btn primary" id="w3Cal" data-i18n="s3Btn"></button>
          </div>
        </div>
        <div class="wstep" data-step="4">
          <div class="wpic">🎉</div>
          <h3 data-i18n="doneTitle"></h3>
          <p data-i18n="doneText"></p>
          <button class="btn primary big" id="wDone" data-i18n="goLessons"></button>
        </div>
      </div>
    </section>

    <!-- LESSONS -->
    <section id="lessons" class="screen">
      <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2 data-i18n="lessons"></h2><span></span></header>
      <p class="intro" data-i18n="lessonsIntro"></p>
      <div class="list" id="lessonList"></div>
      <p class="list-foot" data-i18n="lessonTip"></p>
    </section>

    <!-- LIBRARY -->
    <section id="library" class="screen">
      <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2 data-i18n="songs"></h2><span></span></header>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="builtin" role="tab" data-i18n="library"></button>
        <button class="tab" data-tab="mine" role="tab" data-i18n="mySongs"></button>
      </div>
      <div class="list" id="songList"></div>
      <div class="list-foot" id="listFoot"></div>
    </section>

    <!-- SONG SHEET -->
    <section id="sheet" class="screen">
      <header class="bar"><button class="back" data-go="library" aria-label="Back">‹</button><h2 id="sheetTitle">Song</h2><span></span></header>
      <div class="card">
        <p class="meta" id="sheetMeta"></p>
        <p class="meta small" id="sheetBest"></p>
        <div class="lesson-pic" id="sheetPic" hidden></div>
        <p id="sheetLessonText" hidden></p>
        <div id="sheetOptions">
          <p class="label" data-i18n="speed"></p>
          <div class="seg" id="speedSeg">
            <button data-speed="0.6" data-i18n="slow"></button>
            <button data-speed="0.8" data-i18n="relaxed"></button>
            <button data-speed="1" data-i18n="normal"></button>
          </div>
          <label class="row switch"><input type="checkbox" id="waitIn" /> <span data-i18n="practice"></span></label>
        </div>
        <div class="actions">
          <button class="btn primary big" id="playBtn" data-i18n="play"></button>
          <button class="btn" id="listenBtn" data-i18n="listen"></button>
        </div>
        <div class="actions secondary" id="sheetMore">
          <button class="btn small" id="editBtn"></button>
          <button class="btn small" id="shareBtn" data-i18n="share"></button>
          <button class="btn small" id="exportBtn" data-i18n="export"></button>
          <button class="btn small" id="saveSharedBtn" hidden data-i18n="saveShared"></button>
          <button class="btn small danger" id="deleteBtn" data-i18n="delete"></button>
        </div>
        <p class="meta small" id="sheetLicense"></p>
      </div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen">
      <canvas id="gameCanvas"></canvas>
      <button id="pauseBtn" class="icon-btn" aria-label="Pause">❚❚</button>
      <div id="pauseMenu" class="overlay" hidden>
        <div class="card">
          <h2 data-i18n="paused"></h2>
          <button class="btn primary" id="resumeBtn" data-i18n="resume"></button>
          <button class="btn" id="restartBtn" data-i18n="restart"></button>
          <button class="btn ghost" id="quitBtn" data-i18n="quit"></button>
        </div>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="results" class="screen">
      <div class="card results">
        <div class="stars" id="resStars"></div>
        <h2 id="resCheer"></h2>
        <p class="muted" id="resTitle"></p>
        <p class="big" id="resScore"></p>
        <p id="resNew" class="new-best" hidden data-i18n="newBest"></p>
        <dl class="stats" id="resStats"></dl>
        <div class="actions">
          <button class="btn primary" id="retryBtn" data-i18n="retry"></button>
          <button class="btn" id="resNextBtn" data-i18n="next"></button>
        </div>
      </div>
    </section>

    <!-- EDITOR -->
    <section id="editor" class="screen">
      <header class="bar"><button class="back" id="editorBack" aria-label="Back">‹</button><h2 data-i18n="editorTitle"></h2><button class="btn small primary" id="saveSongBtn" data-i18n="save"></button></header>
      <div class="ed-meta">
        <input id="edTitle" data-i18n-ph="songTitle" maxlength="80" />
        <input id="edComposer" data-i18n-ph="composer" maxlength="80" />
        <label>BPM <input id="edBpm" type="number" min="30" max="300" value="100" /></label>
        <label><span data-i18n="beatsBar"></span> <select id="edBeats"><option>2</option><option>3</option><option selected>4</option><option>6</option></select></label>
        <label><span data-i18n="rights"></span> <select id="edLicense">
          <option value="original" data-i18n="rOriginal"></option>
          <option value="public-domain" data-i18n="rPd"></option>
          <option value="permission" data-i18n="rPerm"></option>
        </select></label>
      </div>
      <p class="hint" data-i18n="edHint"></p>
      <div class="ed-actions">
        <button class="btn rec" id="recordBtn" data-i18n="record"></button>
        <label class="switch small"><input type="checkbox" id="edMetro" checked /> <span data-i18n="metronome"></span></label>
        <button class="btn" id="previewBtn" data-i18n="preview"></button>
        <button class="btn" id="edPlayBtn" data-i18n="playIt"></button>
      </div>
      <div class="ed-tools">
        <label><span data-i18n="newNote"></span> <select id="edLen">
          <option value="0.5">♪ ½</option><option value="1" selected>♩ 1</option><option value="1.5">♩. 1½</option><option value="2">𝅗𝅥 2</option><option value="3">𝅗𝅥. 3</option><option value="4">𝅝 4</option>
        </select></label>
        <label><span data-i18n="grid"></span> <select id="edGrid"><option value="0.25">¼</option><option value="0.5" selected>½</option><option value="1">1</option></select></label>
        <span class="sep"></span>
        <button class="tool" data-act="left" data-i18n-title="moveL">◀</button>
        <button class="tool" data-act="right" data-i18n-title="moveR">▶</button>
        <button class="tool" data-act="up" data-i18n-title="pitchUp">▲</button>
        <button class="tool" data-act="down" data-i18n-title="pitchDown">▼</button>
        <button class="tool" data-act="shorter" data-i18n-title="shorter">−</button>
        <button class="tool" data-act="longer" data-i18n-title="longer">＋</button>
        <button class="tool danger" data-act="delete" data-i18n-title="delNote">🗑</button>
      </div>
      <div class="roll">
        <div class="roll-labels"></div>
        <div class="roll-scroll"><canvas class="roll-grid"></canvas></div>
      </div>
      <div class="ed-actions end">
        <button class="btn ghost" id="importBtn" data-i18n="import"></button>
        <button class="btn ghost danger" data-act="clear" data-i18n="clearAll"></button>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="screen">
      <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2 data-i18n="settings"></h2><span></span></header>
      <div class="card">
        <p class="label" data-i18n="language"></p>
        <div class="seg" id="langSeg">
          <button data-lang="auto" data-i18n="auto"></button>
          <button data-lang="en">English</button>
          <button data-lang="es">Español</button>
        </div>
        <p class="label" data-i18n="labels"></p>
        <div class="seg col" id="profileSeg">
          <button data-profile="pad5" data-i18n="labelsButtons"></button>
          <button data-profile="names" data-i18n="labelsNames"></button>
        </div>
        <label class="row switch"><input type="checkbox" id="namesIn" /> <span data-i18n="showNames"></span></label>
        <p class="label" data-i18n="noteSpeed"></p>
        <div class="seg" id="nsSeg">
          <button data-ns="170" data-i18n="slow"></button>
          <button data-ns="230" data-i18n="normal"></button>
          <button data-ns="320">⚡</button>
        </div>
        <button class="btn" id="setupAgainBtn" data-i18n="setupAgain"></button>
      </div>
      <div class="card">
        <h3 data-i18n="legend"></h3>
        <div id="legend" class="legend"></div>
      </div>
      <details class="card">
        <summary data-i18n="advanced"></summary>
        <h3 data-i18n="micTest"></h3>
        <button class="btn primary" id="micBtn" data-i18n="micOn"></button>
        <div class="tuner" id="tuner">
          <div class="tuner-note" id="tunerNote">—</div>
          <div class="tuner-hint" id="tunerHint"></div>
          <div class="tuner-bar"><i id="tunerNeedle"></i></div>
          <div class="level"><i id="levelBar"></i></div>
        </div>
        <p class="small muted" data-i18n="micPrivacy"></p>
        <label class="row"><span data-i18n="delay"></span> <output id="latOut"></output>
          <input type="range" id="latIn" min="0" max="500" step="5" />
        </label>
        <p class="small muted" data-i18n="delayHelp"></p>
        <button class="btn small" id="calLatBtn" data-i18n="calibrate"></button>
        <label class="row"><span data-i18n="tuning"></span> <output id="tuneOut"></output>
          <input type="range" id="tuneIn" min="-50" max="50" step="1" />
        </label>
        <button class="btn small" id="calTuneBtn" data-i18n="autoTune"></button>
        <label class="row"><span data-i18n="sensitivity"></span> <output id="sensOut"></output>
          <input type="range" id="sensIn" min="0.5" max="4" step="0.1" />
        </label>
        <label class="row switch"><input type="checkbox" id="octIn" /> <span data-i18n="anyOctave"></span></label>
        <label class="row switch"><input type="checkbox" id="lenIn" /> <span data-i18n="lenient"></span></label>
      </details>
    </section>

    <!-- ABOUT -->
    <section id="about" class="screen">
      <header class="bar"><button class="back" data-go="home" aria-label="Back">‹</button><h2 data-i18n="about"></h2><span></span></header>
      <div class="card prose">
        <p data-i18n="aboutP1"></p>
        <p data-i18n="aboutP2"></p>
        <p data-i18n="aboutP3"></p>
        <p data-i18n="aboutP4"></p>
        <p><a id="repoLink" href="#" target="_blank" rel="noopener" data-i18n="source"></a> · MIT</p>
        <p><a class="coffee donate" href="#" target="_blank" rel="noopener" data-i18n="coffee"></a></p>
      </div>
    </section>

    <!-- CALIBRATION OVERLAY -->
    <div id="calOverlay" class="overlay" hidden>
      <div class="card">
        <h2 id="calTitle"></h2>
        <p id="calText"></p>
        <div class="cal-dots" id="calDots"></div>
        <button class="btn ghost" id="calCancel" data-i18n="cancel"></button>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden />
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
